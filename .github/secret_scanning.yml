# GitHub secret scanning — chemins ignorés.
# =============================================================================
# Forge est un OUTIL DE SÉCURITÉ : il embarque de FAUX secrets PAR CONCEPTION (le corpus de test de
# rédaction/détection est précisément la table des jetons qui DOIVENT disparaître d'un rapport, et la
# vérif JWT/OIDC a besoin d'une paire RSA de test). Sans ces exclusions, le secret-scanning natif
# alerte en boucle sur ces fixtures.
#
# ⚠️ RÈGLE : on n'ignore JAMAIS un RÉPERTOIRE. Chaque entrée est UN FICHIER dont on a vérifié
# qu'il contient une fixture non-secrète, et rien d'autre. `tests/**`, `docs/**` et `k8s/**` sont des
# arborescences vivantes : les ignorer en bloc rendrait invisible un vrai secret déposé plus tard.
# Ne pas non plus ajouter un fichier "au cas où" — ajouter uniquement sur alerte constatée, après
# avoir vérifié que la valeur est bien une fixture.
#
# Pendant natif de l'allowlist gitleaks de la CI (.github/workflows/ci.yml, job security). Là-bas les
# suppressions sont scopées À LA RÈGLE en plus du fichier ; ici GitHub ne permet que le chemin.
paths-ignore:
  # Corpus de rédaction : les faux jetons (Slack/GCP/GitLab/AWS + clé privée) qui doivent être masqués.
  - "tests/test_redact.py"
  - "tests/test_finding_redaction_and_soundness.py"
  - "tests/test_report_engagement.py"
  # Oracle de détection de secrets exposés : jeton Stripe de fixture.
  - "tests/test_recon_active.py"
  # Paire RSA de TEST sous `#[cfg(test)]`, pour la vérification de signature JWT/OIDC.
  # Extraction des modules de test : chemin ACTUEL d'abord, ancien conservé (l'historique reste scanné).
  - "console/src/sso/tests.rs"
  - "console/src/sso.rs"
  # Constante AWS canonique du self-test de rédaction.
  - "console/src/reports/tests.rs"
  - "console/src/reports.rs"
  # Exemples de FORMAT de clé dans la documentation de custody/secrets.
  - "docs/KEY_CUSTODY.md"
  - "docs/SECRETS.md"
