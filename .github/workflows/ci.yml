# Forge — CI (usage AUTORISÉ uniquement, aucun I/O réseau offensif en CI).
# =============================================================================
#
# Jobs :
#   - python     : `python3 -m unittest discover` (cœur pur-stdlib, zéro dépendance) ;
#   - console    : `cargo test` + `cargo build --release` du crate Rust de la console ;
#   - purple-e2e : la BOUCLE purple de bout en bout (moteur -> ingest -> détections -> couverture)
#                  contre le SOC de démonstration loopback `tools/mock_plume.py`.
#
# Le crate `console/` dépend de guatx-core via la git-dep publique `guatxlabs/core@v0.2.1`
# (console/Cargo.toml + Cargo.lock épinglé sur le rev du tag). Les jobs cargo la résolvent
# DIRECTEMENT depuis le repo public — aucun checkout voisin, aucun [patch] : c'est exactement
# ce qu'un clone standalone fait, donc la CI prouve le build public. (Un `console/.cargo/config.toml`
# local et gitignoré peut rediriger la git-dep vers une copie locale du crate pour itérer plus vite —
# build non-locked ; il n'entre jamais en CI ni dans un clone.)
#
# Toutes les versions (actions, toolchain Rust, Python) sont PINNÉES pour la
# reproductibilité.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Annule les runs obsolètes sur une même ref (économie de runners).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Registre public — IDENTITÉ d'auteur et ADRESSAGE des messages de commit.
  #
  # C'est la barrière qui FERME. Le hook `commit-msg` (`.githooks/`, activé par
  # `core.hooksPath`) évite d'avoir à corriger après coup, mais il n'est pas
  # transporté par `git clone` et n'est JAMAIS exécuté par l'édition via
  # l'interface web de GitHub — c'est précisément par là qu'étaient entrés des
  # commits portant un compte personnel. Ce job voit tout ce qui arrive au dépôt.
  # ---------------------------------------------------------------------------
  register:
    name: registre public (identité + adressage)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout forge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0          # la plage poussée doit être lisible

      - name: Vérifier les commits poussés
        # Les deux valeurs sont des SHA imposés par GitHub, pas du texte libre — mais elles
        # passent par `env:` plutôt que par une interpolation dans `run:`, qui est le motif
        # d'injection à ne pas installer, fût-ce sur une entrée aujourd'hui inoffensive.
        env:
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PUSH: ${{ github.event.before }}
        run: |
          set -eu
          # Plage : les commits AJOUTÉS par ce push / cette PR. Sur une branche neuve
          # (`before` = 000…0) ou un dispatch manuel, on retombe sur le dernier commit.
          #
          # Le repli passe par `--rev HEAD`, PAS par une plage littérale « -1 HEAD » : git
          # reçoit cet argument comme UNE seule révision, la refuse, et le garde ne voyait
          # alors aucun commit — donc aucune faute, donc un vert. Ce chemin de repli est le
          # cas NORMAL d'une branche neuve : il était vert sans rien lire.
          BASE="${BASE_PR:-${BASE_PUSH:-}}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "plage vérifiée : HEAD seul (pas de base lisible)"
            python3 scripts/check_commit_register.py --rev HEAD
          else
            echo "plage vérifiée : $BASE..HEAD"
            python3 scripts/check_commit_register.py --range "$BASE..HEAD"
          fi

  # ---------------------------------------------------------------------------
  # Plancher Python DÉCLARÉ — `pyproject.toml` annonce `requires-python`, et rien ne le
  # vérifiait : la suite tourne sur 3.11, donc toute syntaxe 3.10-only serait passée. Un cas
  # RÉEL a coûté 53 erreurs d'import en CI — une f-string réutilisant le guillemet englobant,
  # légale seulement depuis 3.12 (PEP 701), dans un paquet qui déclare 3.9.
  #
  # UN `compileall` SUFFIT et rien de moins ne marche : `ast.parse(feature_version=…)` depuis un
  # interpréteur récent N'A PAS détecté ce cas (vérifié pour 3.9, 3.11 et 3.12). Seul le vrai
  # interpréteur du plancher tranche.
  # ---------------------------------------------------------------------------
  plancher:
    name: plancher python déclaré (compileall)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout forge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Lire le plancher déclaré dans pyproject.toml
        id: plancher
        run: |
          set -eu
          V=$(python3 - <<'PY'
          import re, pathlib
          m = re.search(r'requires-python\s*=\s*"[^0-9]*([0-9]+\.[0-9]+)',
                        pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(m.group(1) if m else "")
          PY
          )
          [ -n "$V" ] || { echo "::error::requires-python illisible dans pyproject.toml"; exit 1; }
          echo "plancher déclaré : $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ steps.plancher.outputs.version }}

      # Le RUNTIME livré seulement : `tests/` peut légitimement utiliser une syntaxe plus récente,
      # il n'est pas distribué. C'est `forge/` que `pip install` pose chez un tiers.
      - name: Le paquet livré compile au plancher déclaré
        run: python -m compileall -q forge/

  # ---------------------------------------------------------------------------
  # Python — tests du cœur Forge (stdlib only, aucune dépendance à installer).
  # ---------------------------------------------------------------------------
  python:
    name: python (unittest)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout forge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      # Le CŒUR runtime est stdlib-only, mais la SUITE de tests a besoin de pytest (un test contrib
      # l'importe) + cryptography (les tests ed25519 du ledger l'exigent, sinon repli HMAC → assertions
      # ed25519 KO). Extra `test` de pyproject — n'ajoute AUCUNE dép au runtime livré.
      - name: Install test deps (pytest + cryptography)
        run: |
          python3 -m pip install --upgrade pip
          pip install -e ".[test]"

      # Garde-fou source-de-vérité-unique : échoue si VERSION, pyproject.toml et Cargo.toml
      # divergent (cf. scripts/check_version.py / `make check-version`). Placé AVANT les tests
      # pour fail-fast sur une dérive de version.
      - name: Version drift check (VERSION == pyproject == Cargo.toml)
        run: make check-version

      # La garde de gouvernance du SPA (tests/test_console_spa_governance.py) prouve par EXÉCUTION que
      # la porte réseau unique attache la preuve opérateur : elle importe le module d'API réel sous un
      # runtime JavaScript. Sans runtime, ces tests-là se SAUTENT (le reste de la garde est pur-stdlib).
      # Un saut est acceptable sur un poste de dev, jamais en CI : cette étape échoue si `node` manque,
      # et `FORGE_REQUIRE_JS_RUNTIME=1` ci-dessous transforme l'absence en ÉCHEC de test plutôt qu'en saut.
      - name: JavaScript runtime present (garde comportementale du SPA)
        run: node --version

      - name: Unit tests
        env:
          FORGE_REQUIRE_JS_RUNTIME: "1"
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  # ---------------------------------------------------------------------------
  # Console — tests + build release du crate Rust (core résolu via la git-dep publique).
  # Porte aussi la garde d'INVARIANT openssl-freedom (deux premières étapes, fail-fast) : c'est ce
  # job qui répond du build par défaut, donc c'est ici que l'invariant qui le décrit est MESURÉ.
  # ---------------------------------------------------------------------------
  console:
    name: console (cargo test + build --release)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout forge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust toolchain (pinné)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # @stable (no semver tags; pinned to stable branch commit)
        with:
          toolchain: "1.96.0"
          components: clippy

      - name: Cache cargo (registry + target)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            console/target
          key: cargo-${{ runner.os }}-${{ hashFiles('console/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # L'invariant « zéro bibliothèque système de crypto/TLS » (ni openssl, ni native-tls, ni aws-lc,
      # ni schannel, ni security-framework dans la fermeture) était AFFIRMÉ dans une vingtaine
      # d'endroits du dépôt, et NULLE PART MESURÉ. Il était vrai pour le build par défaut et pour
      # `store-postgres` (0 occurrence), et FAUX pour `object-store` (12) et `--all-features` (20) —
      # via une chaîne TRANSITIVE `rust-s3 -> attohttpc -> rustls/DEFAULT -> aws-lc-rs`. L'affirmation
      # a été périmétrée dans la doc ; cette garde est ce qui l'empêche de se re-périmer EN SILENCE,
      # parce qu'une phrase de doc ne se re-mesure pas toute seule à la prochaine dépendance ajoutée.
      #
      # Placée AVANT `cargo test` pour FAIL-FAST : `cargo tree` ne compile rien (quelques secondes),
      # là où découvrir la régression après 10 min de build ne l'aurait pas rendue plus vraie. Elle
      # n'exige 0 QUE sur les périmètres contractuels (défaut, `store-postgres`) ; elle MESURE ET
      # AFFICHE les périmètres exclus sans les exiger, pour que l'exclusion reste visible.
      # `--locked` : la garde mesure l'arbre verrouillé, elle ne réécrit jamais Cargo.lock.
      - name: Invariant openssl-freedom (périmètres défaut + store-postgres)
        run: python3 scripts/check_openssl_freedom.py

      # ET LA GARDE DOIT PROUVER QU'ELLE MORD. Un contrôle incapable d'échouer est un décor : si la
      # détection se casse (motif mort, format de `cargo tree` changé), le contrôle ci-dessus passerait
      # au vert en annonçant exactement le contraire de la réalité, et rien ne le dirait. L'auto-test
      # exige 0 sur le périmètre CONNU SALE (`--all-features`) et ne rend 0 que si la garde a bien
      # ROUGI. Il rougit donc dans les deux cas qui demandent un humain : détection cassée, OU chaîne
      # réparée en amont — auquel cas l'exclusion documentée doit être retirée.
      - name: La garde mord encore (auto-test rouge sur le périmètre exclu)
        run: python3 scripts/check_openssl_freedom.py --self-test-red

      # cargo résout guatx-core depuis la git-dep publique guatxlabs/core@v0.2.1 (réseau) —
      # cohérent avec Cargo.lock (source git+tag), identique à un clone standalone.
      - name: cargo test (console)
        working-directory: console
        run: cargo test --locked --verbose

      - name: cargo build --release (console)
        working-directory: console
        run: cargo build --release --locked --verbose

      - name: Upload artefact (binaire console)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge
          path: console/target/release/forge
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Purple E2E — la BOUCLE COMPLÈTE (le différenciateur du produit) exécutée pour de vrai :
  #
  #     moteur Python (ROE -> fire -> run-record ATT&CK)
  #       -> POST /api/ingest                        (binaire console produit par le job `console`)
  #       -> GET  /api/coverage/detections?since=N   (SOC de démo : tools/mock_plume.py)
  #       -> GET  /api/purple/coverage               (jointure MITRE + detection_rate + MTTD)
  #
  # Les deux produits sont testés unitairement chacun de leur côté ; RIEN ne vérifiait que le CONTRAT
  # entre eux tient. Ce job échoue dès qu'il dérive : nom de champ du run-record, forme de la réponse
  # du SOC (`{detections:[{mitre,count,first_ts}]}`), sémantique de la fenêtre `since`, jointure
  # detected/missed, calcul du taux ou du MTTD. Le scénario et les valeurs attendues sont décrits dans
  # scripts/purple_loop_e2e.py (attentes DÉRIVÉES des tirs réels, pas recopiées d'un run).
  #
  # POURQUOI C'EST AUTORISÉ malgré la règle « aucun I/O réseau offensif en CI » — vérifié en LISANT le
  # code, pas sur parole :
  #   * tools/mock_plume.py est du LOOPBACK PUR : stdlib (http.server), il ne fait QUE répondre (aucune
  #     socket cliente dans le fichier), son bind est `--host 127.0.0.1` (défaut ET forcé en argv par le
  #     driver) et son seed est un fichier local ;
  #   * la console est bindée sur 127.0.0.1 et sa source de détection (PLUME_URL) pointe ce loopback —
  #     son unique fetch sortant va donc sur 127.0.0.1 ;
  #   * le TIR est `demo.fingerprint`, le module de démonstration dont `fire()` fabrique un finding
  #     SYNTHÉTIQUE sans aucun I/O réseau (forge/modules/demo.py) — aucun outil offensif n'est invoqué ;
  #   * les cibles sont des IP littérales loopback (127.0.0.x) : le ROE les épingle sans résolution, la
  #     CI n'émet même pas une requête DNS.
  # ---------------------------------------------------------------------------
  purple-e2e:
    name: purple (E2E boucle forge <-> mock_plume)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # réutilise le binaire RELEASE déjà produit et publié en artefact par le job `console` : la boucle
    # est exercée sur le binaire qu'on livre, sans payer un second build.
    needs: [console]
    steps:
      - name: Checkout forge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Récupérer le binaire console (artefact du job `console`)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: forge
          path: bin

      - name: Rendre le binaire exécutable
        run: chmod +x bin/forge

      # Aucune dépendance à installer : le moteur Forge et le stub SOC sont stdlib-only.
      - name: Boucle purple de bout en bout (tir -> ingest -> détections -> couverture)
        run: python3 scripts/purple_loop_e2e.py --console-bin bin/forge

  # ---------------------------------------------------------------------------
  # Console (Postgres) — MATRICE de backend : le job `console` ci-dessus couvre le DÉFAUT SQLite
  # (feature OFF) ; ce job couvre le backend Postgres OPT-IN (`--features store-postgres`) contre un
  # vrai Postgres 16 (service container). Prouve le seam PG + le reconnect+retry HA (Stage 4). Le build
  # community reste byte-identique/openssl-free — c'est le job `console` qui le garde vert, et la garde
  # `scripts/check_openssl_freedom.py` qu'il exécute couvre AUSSI le périmètre `store-postgres` (0 hit
  # attendu ici comme au défaut ; le périmètre qui déborde est `object-store`, exclu et documenté).
  # ---------------------------------------------------------------------------
  console-postgres:
    name: console (postgres — cargo test --features store-postgres)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forgepw
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        # Le runner attend que le service soit SAIN avant de lancer les steps.
        options: >-
          --health-cmd "pg_isready -U forge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout forge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust toolchain (pinné)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # @stable (no semver tags; pinned to stable branch commit)
        with:
          toolchain: "1.96.0"
          components: clippy

      - name: Cache cargo (registry + target)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            console/target
          key: cargo-pg-${{ runner.os }}-${{ hashFiles('console/Cargo.lock') }}
          restore-keys: |
            cargo-pg-${{ runner.os }}-

      # clippy DOIT rester vert avec la feature (openssl-free, TLS rustls/ring).
      - name: clippy (feature store-postgres)
        working-directory: console
        run: cargo clippy --all-targets --features store-postgres

      # Le seam PG + les tests d'intégration (dont le reconnect+retry HA) tournent contre le service PG.
      - name: cargo test (feature store-postgres, contre le service Postgres)
        working-directory: console
        env:
          TEST_PG_URL: postgres://forge:forgepw@localhost:5432/forge
        run: cargo test --locked --features store-postgres --verbose

      - name: cargo build --release (feature store-postgres)
        working-directory: console
        run: cargo build --release --locked --features store-postgres --verbose

  # ---------------------------------------------------------------------------
  # Security — supply-chain + secret hygiene. Independent gate: runs in parallel with the
  # build/test jobs and never gates their logic. Two checks:
  #   1) cargo-audit  — RustSec advisory scan of the console crate's locked dep tree (--deny warnings
  #      => unmaintained/yanked/vuln advisories FAIL the job). It reads console/Cargo.lock ONLY: no
  #      build happens and the guatx-core git-dep is never fetched, so core's own tree is NOT audited
  #      here (core carries its own CI).
  #   2) cargo-deny   — LICENCE, bans et provenance des dépendances du même crate (`deny.toml` à la
  #      racine). Axe DISTINCT du précédent : cargo-audit dit si une dépendance est vulnérable,
  #      cargo-deny si l'on a le droit de la redistribuer dans un binaire AGPL. Il manquait ici
  #      alors que `plume` et `ocular` en ont chacun un. Lancé `--all-features`, sur les manifestes
  #      DÉCOUVERTS par `git ls-files` — voir le commentaire de l'étape. ⚠️ IL N'EST PAS EXHAUSTIF :
  #      239 crates examinés sur 290, le sous-arbre `object-store` lui échappe (cause établie, cf.
  #      l'en-tête de `deny.toml`) — d'où le point 2bis, qui n'est pas un doublon mais le
  #      complément qui atteint ce sous-arbre.
  #   2bis) check_dep_licenses.py — les LICENCES du graphe COMPLET (290 crates, via
  #      `cargo metadata --all-features`), contre la MÊME liste `allow` lue dans `deny.toml`. Sans
  #      elle, deux crates non autorisés (`attohttpc` MPL-2.0, `tiny-keccak` CC0-1.0) passaient
  #      sans être lus. Son auto-test rouge suit immédiatement : une garde qui ne peut pas échouer
  #      est un décor.
  #   3) gitleaks     — secret scan of the tree + history, with an ephemeral config (written below,
  #      NOT committed) that extends the default ruleset. Every suppression in it is scoped to ONE
  #      RULE **and** to the exact fixture file that trips it — see the comment on that step.
  # (The Python engine is stdlib-only — zero third-party deps — so there is no pip dependency tree to
  #  audit; the Rust crate is the only supply-chain surface, covered by cargo-audit above.)
  # ---------------------------------------------------------------------------
  security:
    name: security (cargo-audit + cargo-deny + licences graphe complet + gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout forge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0   # full history so gitleaks can scan past commits, not just the tip.

      # AVANT tout scan de secrets, et pour cause : un octet NUL dans un fichier suivi le fait
      # classer en `data`, et `grep` SANS `-a` le saute EN SILENCE. Mesuré sur ce dépôt :
      # `console/src/common.rs` portait un NUL dans un commentaire, et grep y trouvait 0
      # occurrence d'un motif présent 9 fois. Un secret déposé là n'aurait été vu par personne.
      # La garde ne vérifie pas ce fichier : elle exige que TOUT fichier suivi porteur d'un NUL
      # soit déclaré binaire dans `.gitattributes` — donc un fichier ajouté demain est couvert
      # par construction — et que la déclaration reste étroite, pour qu'un `*.rs binary` ne la
      # désarme pas d'une ligne. Les 3 mutations correspondantes ont été vérifiées rouges.
      - name: Aucun octet NUL non déclaré (sinon les scans de secrets sautent le fichier)
        run: python3 scripts/check_no_stray_nul.py

      - name: Setup Rust toolchain (pinné)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # @stable (no semver tags; pinned to stable branch commit)
        with:
          toolchain: "1.96.0"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit (console crate — deny warnings)
        working-directory: console
        run: cargo audit --deny warnings

      # Conformité de LICENCE des dépendances — l'axe qui manquait. `forge` scannait les AVIS
      # (cargo-audit, juste au-dessus) mais pas les licences, là où `plume` et `ocular` en ont
      # chacun une : asymétrie entre dépôts publiés, sur un binaire AGPL qui embarque tout son
      # graphe. « Cette dépendance est-elle vulnérable » et « avons-nous le droit de la
      # redistribuer » sont deux questions, et une seule était posée.
      #
      # LES MANIFESTES SONT DÉCOUVERTS, PAS NOMMÉS. `forge` n'a qu'un crate aujourd'hui, mais
      # nommer `console/Cargo.toml` ici laisserait le prochain crate hors contrôle sans que
      # rien ne le dise — le cas s'est produit dans `plume`, où cargo-deny ne couvrait qu'un
      # manifeste sur quatre, dont pas celui installé chez les clients. La liste vient donc de
      # `git ls-files`, et zéro manifeste trouvé fait ÉCHOUER l'étape plutôt que la rendre
      # verte à vide.
      #
      # `--all-features` PORTE, mesuré : les deps des features opt-in sont `optional` et
      # n'entrent pas dans le graphe par défaut — 201 crates examinés sans le drapeau, 239 avec.
      #
      # ⚠️ CETTE ÉTAPE N'EST PAS EXHAUSTIVE, ET LE CHIFFRE LE DIT : 239 crates examinés pour 290
      # dans `Cargo.lock`. cargo-deny perd le sous-arbre `object-store` — cause ÉTABLIE le
      # 2026-08-07 (dépendance OPTIONNELLE dont le nom de paquet `rust-s3` diffère du nom de sa
      # `[lib]`, `s3` : l'appariement feature <-> arête échoue), démonstration par mutation et
      # conséquences dans l'en-tête de `deny.toml`. Ce qui échappait n'était pas anodin :
      # `attohttpc` (MPL-2.0) et `tiny-keccak` (CC0-1.0) auraient FAIT ÉCHOUER ce contrôle. Ne
      # pas lire ce job comme couvrant tout le graphe — l'étape suivante est ce qui le couvre.
      # Chemin `--config` ABSOLU, et pas relatif : un `--config` relatif est résolu depuis le
      # dossier du MANIFESTE et retombe EN SILENCE sur la config par défaut de cargo-deny.
      #
      # Binaire ÉPINGLÉ par version + sha256, comme gitleaks plus bas : `cargo install`
      # recompilerait l'outil à chaque exécution pour le même résultat, et sans vérifier quoi
      # que ce soit. Version et empreinte identiques à celles de `plume` — une seule vérité
      # dans la famille de dépôts.
      - name: Licences, bans et sources des dépendances (cargo-deny, binaire épinglé)
        run: |
          set -euo pipefail
          CD_VER=0.18.2
          CD_SHA=43c4a79c4b9fd1fcb3dddb305a1b4d8f7ac4a72accd61bb50a0b698789ca894c
          CD_TGZ="cargo-deny-${CD_VER}-x86_64-unknown-linux-musl"
          curl -sSfL -o /tmp/cargo-deny.tgz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CD_VER}/${CD_TGZ}.tar.gz"
          echo "${CD_SHA}  /tmp/cargo-deny.tgz" | sha256sum -c -
          tar -xzf /tmp/cargo-deny.tgz --strip-components=1 -C /tmp "${CD_TGZ}/cargo-deny"

          statut=0
          nb=0
          while IFS= read -r manifeste; do
            [ -n "$manifeste" ] || continue
            nb=$((nb + 1))
            echo "::group::cargo-deny ${manifeste}"
            if ! /tmp/cargo-deny --locked --all-features --manifest-path "$manifeste" \
                 check --config "$GITHUB_WORKSPACE/deny.toml" licenses bans sources; then
              echo "::error file=${manifeste}::licence, ban ou source de dépendance refusée"
              statut=1
            fi
            echo "::endgroup::"
          done < <(git ls-files '*Cargo.toml' 'Cargo.toml')

          # Un contrôle qui n'a rien eu à contrôler n'est pas vert : c'est une sonde cassée.
          [ "$nb" -gt 0 ] || { echo "::error::aucun manifeste Cargo trouvé — ce contrôle est devenu muet, le réparer"; exit 1; }
          echo "$nb manifeste(s) contrôlé(s)"
          exit $statut

      # CE QUI COUVRE L'ANGLE MORT DE L'ÉTAPE PRÉCÉDENTE. cargo-deny examine 239 crates sur les
      # 290 du `Cargo.lock` : il perd tout le sous-arbre `object-store`, et deux des crates
      # perdus (`attohttpc` MPL-2.0, `tiny-keccak` CC0-1.0) l'auraient fait ÉCHOUER. Laisser
      # croire que l'audit de licence couvre tout serait une affirmation plus large que ce
      # qu'elle recouvre — c'est le défaut réparé ici.
      #
      # Cette garde refait le contrôle de LICENCE sur `cargo metadata --all-features --locked`,
      # qui rend bien les 290 crates, en LISANT la liste `allow` de `deny.toml` : une seule
      # vérité de politique, deux moteurs pour l'appliquer. `--cargo-deny` lui passe le binaire
      # déjà téléchargé plus haut, pour qu'elle IMPRIME le différentiel exact (les 51 crates
      # manquants, nommés) au lieu de le décrire. Elle est fail-closed : cargo en échec, graphe
      # implausible, `deny.toml` illisible ou évaluateur SPDX muet rendent 2, jamais 0.
      - name: Licences du graphe COMPLET (couvre le sous-arbre que cargo-deny ne descend pas)
        run: python3 scripts/check_dep_licenses.py --cargo-deny /tmp/cargo-deny

      # ET ELLE DOIT PROUVER QU'ELLE MORD. Même doctrine que l'auto-test openssl-freedom du job
      # `console` : un contrôle incapable d'échouer est un décor. L'auto-test rejoue le contrôle
      # en retirant de la politique les licences atteignables UNIQUEMENT sous `object-store`
      # (`MPL-2.0`, `CC0-1.0`) et n'est vert que si la garde a rougi EN NOMMANT `attohttpc` et
      # `tiny-keccak` — c'est-à-dire seulement si elle atteint vraiment le sous-arbre qu'elle
      # prétend couvrir. Il rougit donc dans les deux cas qui demandent un humain : évaluation
      # cassée, OU sous-arbre disparu (feature retirée, rust-s3 remplacé) — auquel cas
      # l'exclusion documentée dans `deny.toml` doit être retirée.
      - name: La garde de licence mord encore (auto-test rouge sur l'angle mort)
        run: python3 scripts/check_dep_licenses.py --self-test-red

      # Config gitleaks ÉPHÉMÈRE (runner-only, jamais committée) : `extend.useDefault` + des
      # allowlists SCOPÉES À LA RÈGLE.
      #
      # POURQUOI par règle et non par répertoire. Forge est un outil de sécurité : il embarque de faux
      # secrets PAR CONCEPTION (corpus de rédaction, paire RSA de test pour la vérif JWT). Mais
      # allowlister `tests/`, `docs/` ou `k8s/` EN BLOC, pour TOUTES les règles, aveugle le scan sur
      # trois arborescences VIVANTES : une vraie clé déposée plus tard dans docs/ ou k8s/ passerait
      # sans un mot. Le mécanisme utilisé ici (`[[rules]]` portant l'`id` d'une règle par défaut + un
      # `[rules.allowlist]`) NE remplace PAS la règle : sa regex reste active partout ailleurs. Donc
      # `private-key` reste armé sur tout le dépôt SAUF les deux fichiers de fixture nommés, etc.
      #
      # Cette liste est CALIBRÉE sur l'arbre courant (obtenue en partant de zéro allowlist, puis en
      # n'ajoutant que les faux positifs constatés, un par un). Ajouter une entrée sans avoir vérifié
      # la valeur, ou en ajouter « au cas où », c'est refaire le trou qu'on vient de fermer.
      # Après toute modification de l'arbre, revérifier localement :
      #     gitleaks detect --source . --config .gitleaks-ci.toml --no-banner --redact --exit-code 1
      - name: Write gitleaks config (allowlists scopées à la règle)
        run: |
          cat > "$GITHUB_WORKSPACE/.gitleaks-ci.toml" <<'EOF'
          title = "forge CI gitleaks config"
          [extend]
          useDefault = true

          # Paire RSA de TEST sous `#[cfg(test)]` (vérif de signature JWT/OIDC) + corpus de rédaction.
          [[rules]]
          id = "private-key"
          [rules.allowlist]
          paths = [
            # Chemin ACTUEL (extraction des modules de test) + chemin MORT conservé : gitleaks
            # scanne TOUS les commits, l'ancien blob reste donc dans l'historique.
            '''^console/src/sso/tests\.rs$''',
            '''^console/src/sso\.rs$''',
            '''^tests/test_redact\.py$''',
            # Fixtures mTLS : `CLIENT_KEY_PEM` & co. sont annotées « matériel de TEST : elle ne
            # protège rien », et servent de CANARI aux tests `client_key_material_never_leaks_into_*`
            # qui assertent que ce corps n'apparaît dans AUCUNE sortie. Autrement dit : ce fichier
            # doit contenir une clé qui ressemble à une vraie, sinon la garde ne prouve rien.
            '''^console/src/tls/tests\.rs$''',
          ]

          # Constante AWS canonique du self-test de rédaction + corpus rédaction/rapport.
          [[rules]]
          id = "aws-access-token"
          [rules.allowlist]
          paths = [
            '''^console/src/reports/tests\.rs$''',
            '''^console/src/reports\.rs$''',
            '''^tests/test_redact\.py$''',
            '''^tests/test_report_engagement\.py$''',
          ]

          # `generic-api-key` est la règle la plus bruyante : elle matche des NOMS de variables et les
          # `SECRET = "..."` de fixture. Portée : le nom d'env PKCS#11, les `secretKeyRef.key` du
          # Deployment (des noms de clés, pas des valeurs), les exemples de FORMAT de clé de la doc de
          # custody, et le corpus de tests Python.
          [[rules]]
          id = "generic-api-key"
          [rules.allowlist]
          paths = [
            '''^forge/signing_pkcs11\.py$''',
            '''^k8s/40-console\.yaml$''',
            '''^docs/KEY_CUSTODY\.md$''',
            '''^tests/.*\.py$''',
          ]

          # Jetons / JWT de fixture des oracles de détection.
          [[rules]]
          id = "stripe-access-token"
          [rules.allowlist]
          paths = ['''^tests/test_recon_active\.py$''']

          [[rules]]
          id = "jwt"
          [rules.allowlist]
          paths = [
            '''^tests/.*\.py$''',
            # `CANARY_BEARER` : jetons de test dont le payload décode en {"sub":"victim"} et la
            # signature en base64("signaturedetest"). Ils existent pour PROUVER qu'un secret de
            # canal/SLA ne fuit pas dans un corps de notification — les retirer désarmerait la garde.
            '''^console/src/notify_channels\.rs$''',
            '''^console/src/notify_sla\.rs$''',
          ]

          # Les faux jetons fournisseur du corpus de rédaction — et de NULLE PART ailleurs.
          [[rules]]
          id = "slack-bot-token"
          [rules.allowlist]
          paths = ['''^tests/test_redact\.py$''']

          [[rules]]
          id = "gcp-api-key"
          [rules.allowlist]
          paths = ['''^tests/test_redact\.py$''']

          [[rules]]
          id = "gitlab-pat"
          [rules.allowlist]
          paths = ['''^tests/test_redact\.py$''']
          EOF

      # Secret scan via le BINAIRE gitleaks ÉPINGLÉ (pas la gitleaks-action). L'action exige désormais
      # GITHUB_TOKEN sur les événements `pull_request` (et une licence pour les orgs) → elle échouerait
      # sur TOUTE PR, ce qui bloquerait le merge sous un ruleset PR-obligatoire. Le binaire : aucun token,
      # aucune licence, comportement IDENTIQUE sur push ET PR, version + SHA256 vérifiés (supply-chain).
      # Version 8.24.3 = version épinglée famille (identique core/plume). Le job security fait un
      # checkout à la RACINE du workspace (pas sous ./forge) → `--source .`. `--config` = là où le
      # heredoc ci-dessus écrit .gitleaks-ci.toml.
      - name: Secret scan (gitleaks, pinned binary — no token/license required)
        run: |
          set -euo pipefail
          GL_VER=8.24.3
          GL_SHA=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz"
          echo "${GL_SHA}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config "$GITHUB_WORKSPACE/.gitleaks-ci.toml" --no-banner --redact --exit-code 1

  # ---------------------------------------------------------------------------
  # Licence — conformité de ce que le dépôt REDISTRIBUE. Forge embarque quatre
  # `.woff2` (Inter, JetBrains Mono) sous OFL-1.1, dont la clause 2 exige que chaque
  # copie porte l'avis de copyright ET le texte de la licence. Ces quatre fichiers ont
  # déjà été redistribués SANS aucun texte d'OFL : le défaut est réel, pas théorique,
  # et rien en CI ne l'aurait dit.
  #
  # La garde est DÉRIVÉE, pas énumérée. Une liste figée de chemins ne protège que
  # contre la suppression de ce qui est déjà connu ; elle ne dit RIEN d'une police
  # AJOUTÉE demain sans sa licence — c'est exactement le défaut qui est passé.
  # Elle part donc des polices PRÉSENTES et exige, PAR FAMILLE, une licence et un avis.
  # ---------------------------------------------------------------------------
  licence:
    name: licence (tiers redistribués)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout forge
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Les deux ANCRES dont la garde dérivée se sert. Si l'une disparaît, la garde
      # ci-dessous perd sa référence : on l'exige explicitement plutôt que de la
      # laisser échouer par effet de bord.
      - name: Les ancres de licence du dépôt sont présentes et non vides
        run: |
          set -eu
          for f in LICENSE THIRD-PARTY-NOTICES.md; do
            [ -s "$f" ] || { echo "::error file=$f::fichier de licence manquant ou vide"; exit 1; }
          done

      - name: Toute police redistribuée est couverte par une licence et un avis
        # DEUX exigences PAR FAMILLE — le découpage `-latin` / `-latin-ext` n'est pas
        # une famille, une licence couvre la famille pas le sous-ensemble :
        #   1. un texte de licence NON VIDE, dans le dossier de la police, dont
        #      l'AVIS DE COPYRIGHT nomme la famille ;
        #   2. une section `## <Famille>` dans THIRD-PARTY-NOTICES.md.
        #
        # Pourquoi ces deux formes précises, et pas plus simple :
        #   * « un OFL quelconque dans le dossier » suffirait à un dossier qui en
        #     contient déjà un pour une AUTRE famille : la garde passerait alors que
        #     la famille ajoutée n'est couverte par rien. D'où le test sur la ligne
        #     `Copyright` du texte, qui est aussi exactement ce que la clause 2 exige.
        #   * un `grep` de SOUS-CHAÎNE sur les avis serait muet pour « inter », que
        #     contiennent « interactif », « interdit », « interface »… La suppression
        #     de la section « ## Inter » resterait donc VERTE. La comparaison porte
        #     sur les TITRES de section, par ÉGALITÉ.
        #
        # Les polices sont énumérées par TYPE, pas par extension : la signature du
        # format (4 premiers octets) puis, en second filet, la description de `file`.
        # Une police ajoutée sous un autre nom, un autre dossier, ou sans extension
        # est donc couverte par construction. Un fichier mal classé rend le build
        # ROUGE plutôt que muet — la garde échoue du bon côté.
        #
        # Le point 2 prouve que la famille est RECENSÉE, pas que le recensement soit
        # exact : la version, l'amont et l'avis de copyright restent une relecture
        # humaine (ils se lisent dans la table `name` de la police, pas dans son nom
        # de fichier). Trois mutations vérifiées ROUGES : texte de licence supprimé,
        # section d'avis retirée, police ajoutée sans licence.
        run: |
          set -eu
          status=0

          # Univers = ce que le dépôt SUIT, donc ce qu'il redistribue.
          fonts=""
          while IFS= read -r -d '' f; do
            magic=$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')
            case "$magic" in
              # wOF2       wOFF       OTTO       TrueType   'true'     ttcf
              774f4632|774f4646|4f54544f|00010000|74727565|74746366) ;;
              *) file -b "$f" | grep -qiE 'font data|font format|opentype|truetype' || continue ;;
            esac
            fonts="$fonts$f
          "
          done < <(git ls-files -z)

          [ -n "$fonts" ] || { echo "::error::aucune police détectée — ce contrôle est devenu muet, le réparer"; exit 1; }

          # Normalise pour comparer « jetbrains-mono » (nom de fichier) et
          # « JetBrains Mono » (titre de section) : minuscules, sans séparateur.
          # `[ _-]` et non `' -_'` : dans un intervalle, ` -_` va de l'espace au
          # souligné et emporte chiffres, majuscules et ponctuation.
          norm() { tr '[:upper:]' '[:lower:]' | sed 's/[ _-]//g'; }

          headings=$(grep -E '^#{2,} ' THIRD-PARTY-NOTICES.md | sed -E 's/^#+ +//' | norm)

          while IFS= read -r f; do
            [ -n "$f" ] || continue
            dir=$(dirname "$f")
            base=$(basename "$f")
            slug=$(printf '%s' "${base%.*}" | sed -E 's/-latin(-ext)?$//' | norm)
            [ -n "$slug" ] || { echo "::error file=$f::aucune famille dérivable de ce nom de fichier"; status=1; continue; }

            printf '%s\n' "$headings" | grep -qxF "$slug" \
              || { echo "::error file=$f::famille « $slug » redistribuée sans section « ## <famille> » dans THIRD-PARTY-NOTICES.md"; status=1; }

            found=""
            for lic in "$dir"/OFL* "$dir"/LICEN[CS]E* "$dir"/COPYING*; do
              [ -s "$lic" ] || continue
              cp=$(grep -i '^copyright' "$lic" | norm) || true
              case "$cp" in *"$slug"*) found=$lic; break ;; esac
            done
            [ -n "$found" ] \
              || { echo "::error file=$f::aucun texte de licence non vide dont l'avis de copyright nomme « $slug » dans $dir"; status=1; }
          done <<EOF
          $fonts
          EOF

          exit $status

  # ---------------------------------------------------------------------------
  # POINT D'ENTRÉE UNIQUE du ruleset — nom STABLE `CI`. Un ruleset sur `main` doit
  # exiger CE check, JAMAIS les noms générés `python (unittest)` / `console (...)`
  # / `security (...)` : le jour où l'un est renommé, réordonné ou ajouté (matrice,
  # nouveau backend…), un check requis par son nom généré ne remonterait plus et
  # `main` deviendrait IMPOUSSABLE — y compris pour le commit qui réparerait ça.
  # Ce job dépend de tous les autres et ne bouge jamais de nom.
  # ⚠️ Ne poser le required-status-check `CI` dans le ruleset qu'APRÈS un premier
  #    run réel (un check jamais exécuté est exigé mais jamais satisfait).
  # ---------------------------------------------------------------------------
  ci-ok:
    name: CI
    if: always()   # sinon un job en échec SAUTE ce job au lieu de le faire échouer
    # Tout job ajouté au workflow doit l'être AUSSI dans cette liste : un job absent
    # de `needs` s'exécute, échoue… et ne bloque RIEN, puisque le seul contrôle exigé
    # par le ruleset est `CI`, qui ne le regarde pas. À vérifier avant d'affirmer
    # qu'un contrôle « est en CI ».
    needs: [register, plancher, python, console, console-postgres, purple-e2e, security, licence]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Tous les jobs requis doivent avoir RÉUSSI
        # `skipped` et `cancelled` traités comme des ÉCHECS À DESSEIN : GitHub
        # considère un check requis mais sauté comme satisfait, ce qui laisserait
        # passer un job jamais exécuté.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::un job de CI n'a pas réussi : ${{ join(needs.*.result, ', ') }}"
          exit 1
